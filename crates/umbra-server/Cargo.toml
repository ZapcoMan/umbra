[package]
name = "umbra-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UMBRA Web 后端：类 Spring Boot 三层(controller/service/mapper)，对外提供离线 IP 地理查询 HTTP API"

[lib]
name = "umbra_server"
path = "src/lib.rs"

[[bin]]
name = "umbra-server"
path = "src/main.rs"

[dependencies]
umbra-core = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
