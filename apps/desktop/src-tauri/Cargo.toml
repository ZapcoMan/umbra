[package]
name = "umbra-desktop"
version = "0.1.0"
description = "UMBRA 桌面客户端 (Tauri 2)"
edition = "2021"
rust-version = "1.89"

[lib]
name = "umbra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
umbra-core = { path = "../../../crates/umbra-core" }
